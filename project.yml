name: MorseTree
options:
  bundleIdPrefix: com.serhanyavuz
  deploymentTarget:
    iOS: "17.0"
targets:
  MorseTree:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Web/**"]
      - path: App/Web
        type: folder
        buildPhase: resources
      - path: Vendor/codec2
        compilerFlags: ["-w"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Morse Tree
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Push-to-talk records your voice while you hold the talk button and broadcasts it to nearby Morse Tree phones.
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Radio mode broadcasts your Morse over Bluetooth and listens for other nearby Morse Tree phones.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serhanyavuz.morsetree
        PRODUCT_NAME: Morse Tree
        DEVELOPMENT_TEAM: P2NLJ79HGA
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Morse Tree
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/codec2
