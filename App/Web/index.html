<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Morse Tree</title>
<style>
/* Layout: one-screen app — header, the brass tree card, the active mode panel, bottom tab bar. */
:root{
  --ground:#0c0d0b; --card:#141513; --card-edge:#2a2721;
  --brass:#c9a961; --brass-dim:#7d6a40; --ink:#ece6d6; --muted:#8e8775;
  --lit:#43ff74; --lit-soft:rgba(67,255,116,.18); --bad:#ff5a4e;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --round:"SF Pro Rounded",ui-rounded,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#1b1c18 0%,var(--ground) 60%);color:var(--ink);font:15px/1.4 var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
header h1{margin:0;font:600 13px var(--mono);letter-spacing:.28em;color:var(--brass)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:#ffffff10}

/* Card */
.card{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(#171815,#111210);border-radius:20px;padding:10px 10px 8px;
  box-shadow:0 0 0 1.5px var(--brass-dim),0 0 0 4px #0a0a09,0 0 0 5px #3a3326,0 18px 40px #000a}
.card-title{display:flex;justify-content:space-between;padding:2px 34px 0 14px;font:500 17px var(--mono);letter-spacing:.12em;color:var(--brass);flex:none}
.hole{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--ground);box-shadow:0 0 0 2.5px var(--brass)}
svg{flex:1 1 auto;min-height:0;width:100%;display:block}
.no-tr .tr{display:none}
.edge{fill:none;stroke-linejoin:round;stroke:var(--brass);stroke-width:3;stroke-linecap:round;transition:stroke .12s}
.edge.lit{stroke:var(--lit)}
.node{fill:#1d1d1a;stroke:var(--brass);stroke-width:2.6;transition:fill .12s,stroke .12s}
.node.lit{fill:var(--lit);stroke:#b8ffca;filter:url(#glow)}
.node.bad{fill:var(--bad);stroke:#ffb3ad}
.node.sel{stroke:#fff}
.lbl{fill:var(--brass);font:500 19px var(--mono);text-anchor:middle;dominant-baseline:middle;transition:opacity .2s,fill .12s}
.lbl.lit{fill:var(--lit)}
.hide-labels .lbl{opacity:0}
.hide-labels .lbl.reveal{opacity:1}
.dnode{stroke-width:1.6}
.dl{font-size:17px;font-weight:600}
.dl.lit{fill:#0c0d0b}
.dg *{fill:var(--brass)}
.dg.lit *{fill:#0c0d0b}
.numhead{fill:var(--muted);font:500 11px var(--mono);letter-spacing:.1em;dominant-baseline:middle}
.numrule{stroke:var(--card-edge);stroke-width:1}
.hide-labels .dg{opacity:0}
.hit{fill:transparent;cursor:pointer}
.antenna{stroke:var(--brass);stroke-width:2.6;fill:none;stroke-linejoin:round}

/* Panel */
.panel{flex:none;height:258px;display:flex;flex-direction:column;gap:10px;padding:14px 2px 10px}
.panel[hidden]{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.spread{justify-content:space-between}
.chip{height:32px;padding:0 13px;border-radius:16px;background:#ffffff0d;color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--brass);color:#16130b}
.chip:active{transform:scale(.97)}
.seg{display:flex;background:#ffffff0d;border-radius:10px;padding:2px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);padding:0 10px;white-space:nowrap}
#qLevel button{padding:0 8px}
.seg button.on{background:#2b2a25;color:var(--ink)}
.big-letter{font:600 54px/1 var(--round);color:var(--ink);min-width:52px;text-align:center}
.code{font:700 30px/1 var(--mono);letter-spacing:.18em;color:var(--lit)}
.code.empty{color:var(--muted);font-size:15px;letter-spacing:0;font-weight:500;font-family:var(--sans)}
.code.bad{color:var(--bad)}
.hint{color:var(--muted);font-size:13px;line-height:1.45}
.sym{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}
.sym i{display:block;height:11px;border-radius:6px;background:currentColor}
.sym i.d{width:11px}.sym i.h{width:32px}
.score .sym i,.heat .sym i{height:6px}
.crumbs{font:500 14px var(--mono);color:var(--brass)}

/* Keyer */
#keyer{flex:1;min-height:0;display:flex}
.key{flex:1;border-radius:18px;background:linear-gradient(#2a2822,#1d1c18);box-shadow:inset 0 1px 0 #ffffff14,0 0 0 1.5px var(--brass-dim),0 6px 0 #070706;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 18px var(--mono);letter-spacing:.2em;color:var(--brass);transition:transform .05s,box-shadow .05s}
.key small{font:500 11px var(--sans);letter-spacing:.04em;color:var(--muted)}
.key.down,.key:active{transform:translateY(4px);box-shadow:inset 0 1px 0 #ffffff14,0 0 0 1.5px var(--lit),0 2px 0 #070706;color:var(--lit)}
#twoKeys{flex:1;display:flex;gap:10px}
#twoKeys .key{font-size:44px;letter-spacing:0}
.output{height:44px;border-radius:12px;background:#00000055;box-shadow:inset 0 0 0 1px #ffffff10;padding:0 12px;display:flex;align-items:center;gap:8px;overflow:hidden}
.output .text{flex:1;font:500 20px var(--mono);letter-spacing:.06em;white-space:nowrap;overflow:hidden;direction:rtl;text-align:left}
.output .text span{direction:ltr;unicode-bidi:embed}
.output .cur{color:var(--lit);display:flex}
.caret{display:inline-block;width:2px;height:20px;background:var(--brass);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Quiz */
.prompt{display:flex;align-items:center;gap:14px;min-height:62px}
#tInput{flex:1;min-height:0;resize:none;border:0;border-radius:12px;background:#00000055;box-shadow:inset 0 0 0 1px #ffffff14;color:var(--ink);
  font:500 18px/1.4 var(--mono);letter-spacing:.06em;padding:10px 12px;-webkit-user-select:text;user-select:text;text-transform:uppercase}
#tInput:focus{outline:2px solid var(--brass)}
#tInput::placeholder{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:15px}
.tview{font:600 20px/1.35 var(--mono);letter-spacing:.08em;max-height:3.1em;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.tview span{color:var(--muted)}
.tview span.done{color:var(--lit)}
.tview span.cur{color:var(--ink);background:#c9a96133;border-radius:3px;box-shadow:0 2px 0 var(--brass)}
.tview span.skip{opacity:.4}
.typing .card,.typing nav{display:none!important}
.typing .panel{height:auto;flex:1}
.rstatus{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:-4px;white-space:nowrap;overflow:hidden}
.rstatus #rStatus{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rstatus #rRate{font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.talk{font:600 17px var(--sans);gap:10px}
.talk .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.talk.live .dot{background:var(--lit);box-shadow:0 0 10px var(--lit)}
.talk.me .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.ptt{font-size:20px}
.ptt.down{color:var(--bad);box-shadow:inset 0 1px 0 #ffffff14,0 0 0 2px var(--bad),0 2px 0 #070706}
.log .tx{color:var(--lit)}
.log .tag{color:var(--brass);font-size:12px;letter-spacing:.04em;margin-right:4px}
.log .rx{color:var(--ink)}
.log .rx.hid{color:var(--muted)}
.rxcur{display:flex;color:var(--brass)}
.word{font:600 34px/1.1 var(--round);letter-spacing:.04em;display:flex;flex:none}
.word span{color:var(--muted);border-bottom:3px solid transparent}
.word span.done{color:var(--lit)}
.word span.cur{color:var(--ink);border-color:var(--brass)}
.score{margin-left:auto;text-align:right;font:500 12px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.score b{display:block;font:600 20px var(--round);color:var(--ink)}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat i{font:600 10px/16px var(--mono);font-style:normal;width:16px;text-align:center;border-radius:3px;color:#0c0d0b}
.flash-ok{animation:ok .5s}
.flash-bad{animation:bad .5s}
@keyframes ok{30%{color:var(--lit)}}
@keyframes bad{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Tabs */
nav{flex:none;display:flex;border-top:1px solid #ffffff12;margin:0 calc(-1*max(14px,env(safe-area-inset-left,0px)));
  padding:6px max(14px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0}
nav button svg{width:24px;height:24px;flex:none}
nav button.on{color:var(--brass)}

/* Settings sheet */
.sheet-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:#1a1a17;border-radius:20px 20px 0 0;padding:18px max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:0;font:600 17px var(--sans)}
/* glossary */
.sheet{max-height:90vh;max-height:90dvh}
#glossBody{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;margin:0 -4px;padding:0 4px}
#gSearch{height:40px;border-radius:10px;border:0;background:#ffffff10;color:var(--ink);font:500 15px var(--sans);padding:0 12px;-webkit-user-select:text;user-select:text;flex:none}
#gSearch:focus{outline:2px solid var(--brass)}
.g-tip{background:#ffffff0a;border-left:3px solid var(--brass);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45}
.g-tip b{color:var(--brass);font-family:var(--mono)}
.g-sec h3{margin:6px 0 4px;font:600 12px var(--mono);letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
.g-sec p{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.4}
.g-row{display:grid;grid-template-columns:64px 1fr;gap:2px 12px;width:100%;text-align:left;padding:9px 6px;border-radius:8px;border-bottom:1px solid #ffffff0c}
.g-row:active{background:#ffffff10}
.g-row .c{font:600 15px var(--mono);color:var(--ink);grid-row:span 2;align-self:center}
.g-row .m{font-size:14px;color:var(--ink);line-height:1.35}
.g-row .s{font:13px var(--mono);color:var(--muted);letter-spacing:.06em}
.g-row.hot .c{color:var(--brass)}
.g-qso{font:13px/1.4 var(--mono);color:var(--ink);background:#ffffff08;border-radius:8px;padding:8px 10px;margin-bottom:4px;word-break:break-word}
.g-qso small{display:block;font:12px var(--sans);color:var(--muted);margin-top:3px}
.g-empty{font-size:14px;color:var(--muted);padding:8px 0}
.hdr-side{display:flex;width:76px}.hdr-side.r{justify-content:flex-end}
#helpBody{font-size:14px;color:var(--ink)}#helpBody p{margin:0 0 10px}#helpBody b{color:var(--brass)}
#call{height:40px;border-radius:10px;border:0;background:#ffffff10;color:var(--ink);font:600 18px var(--mono);letter-spacing:.12em;padding:0 12px;-webkit-user-select:text;user-select:text;text-transform:uppercase}
#call:focus{outline:2px solid var(--brass)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.field label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brass)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-height:700px){.panel{height:236px}.big-letter{font-size:44px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hdr-side">
    <button class="icon-btn" id="helpBtn" aria-label="How the tree works">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 3.8"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="glossBtn" aria-label="Glossary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
    </button>
    </div>
    <h1>MORSE TREE</h1>
    <div class="hdr-side r">
    <button class="icon-btn" id="setBtn" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    </div>
  </header>

  <div class="card" id="card">
    <div class="hole"></div>
    <div class="card-title"><span>MORSE</span><span>CODE</span></div>
    <svg id="tree" viewBox="-22 16 482 582" preserveAspectRatio="xMidYMid meet" aria-label="Morse code tree">
      <defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g id="edges"></g><g id="nodes"></g><g id="labels"></g><g id="hits"></g>
    </svg>
  </div>

  <!-- LEARN -->
  <section class="panel" id="p-learn">
    <div class="prompt">
      <div class="big-letter" id="lLetter">E</div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <div class="code" id="lCode"></div>
        <div class="crumbs" id="lCrumbs">E</div>
      </div>
    </div>
    <p class="hint" id="lHint" style="margin:0" data-t="lHint"></p>
    <div class="row" style="margin-top:auto">
      <button class="chip" id="lPlay" data-t="play"></button>
      <button class="chip" id="lWalk" data-t="walk"></button>
      <button class="chip" id="lHide" data-t="hide"></button>
    </div>
  </section>

  <!-- KEY -->
  <section class="panel" id="p-key" hidden>
    <div class="output"><div class="text" id="kOut"><span></span></div><span class="caret"></span><span class="cur" id="kCur"></span></div>
    <div class="row spread">
      <div class="seg" id="kMode"><button data-v="1" data-t="oneKey"></button><button data-v="2" data-t="twoKeys"></button></div>
      <div class="row"><button class="chip" id="kSpace" data-t="space"></button><button class="chip" id="kClear" data-t="clear"></button></div>
    </div>
    <div id="keySlot" style="flex:1;min-height:0;display:flex"></div>
  </section>

  <!-- QUIZ -->
  <section class="panel" id="p-quiz" hidden>
    <div class="row spread">
      <div class="seg" id="qType"><button data-v="send" data-t="send"></button><button data-v="recv" data-t="hear"></button><button data-v="word" data-t="words"></button><button data-v="qcode" data-t="qcodes"></button></div>
      <div class="seg" id="qLevel"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">0-9</button></div>
    </div>
    <div class="prompt">
      <div class="big-letter" id="qLetter">E</div><div class="word" id="qWord" hidden></div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div class="code empty" id="qCode">Key this letter</div>
        <div class="heat" id="qHeat"></div><div class="hint" id="qMean" hidden style="color:var(--brass);font-size:13px"></div>
      </div>
      <div class="score"><b id="qStreak">0</b><span data-t="streak"></span> · <span id="qAcc">–</span></div>
    </div>
    <div id="quizKeySlot" style="flex:1;min-height:0;display:flex"></div>
    <div id="recvCtl" class="row" style="flex:1;align-items:flex-end" hidden>
      <button class="chip" id="qReplay" data-t="replay"></button>
      <button class="chip" id="qShowCode" data-t="showCode"></button>
      <button class="chip" id="qShowLetters" data-t="showLetters"></button>
      <button class="chip" id="qSkip" style="margin-left:auto" data-t="skip"></button>
    </div>
  </section>

  <!-- RADIO -->
  <section class="panel" id="p-radio" hidden>
    <div class="row spread"><button class="chip" id="rPower"></button><div class="seg" id="rMode"><button data-v="morse" data-t="chMorse"></button><button data-v="voice" data-t="chVoice"></button></div></div>
    <div class="hint rstatus"><span id="rStatus"></span><span id="rRate"></span></div>
    <div class="output" id="rLogBox"><div class="text log" id="rLog"><span></span></div><span class="cur" id="rCur"></span><span class="rxcur" id="rRxCur"></span></div>
    <div class="output talk" id="rTalk" hidden><span class="dot"></span><span id="rTalkTxt"></span></div>
    <div class="row" id="rMorseRow"><button class="chip" id="rHide" data-t="hideCopy"></button><button class="chip" id="rSendText" data-t="sendText"></button><button class="chip" id="rClear" data-t="clear" style="margin-left:auto"></button></div>
    <div id="radioKeySlot" style="flex:1;min-height:0;display:flex"></div>
    <div id="pttSlot" style="flex:1;min-height:0;display:flex" hidden><button class="key ptt" id="ptt"><span data-t="ptt"></span><small data-t="pttHint"></small></button></div>
  </section>

  <!-- TEXT -->
  <section class="panel" id="p-text" hidden>
    <div id="tEditBox" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px">
      <textarea id="tInput" rows="3" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="row"><button class="chip" id="tListen" data-t="listen"></button><button class="chip" id="tPractice" data-t="practice"></button><span class="hint" id="tStat" style="margin-left:auto"></span></div>
    </div>
    <div id="tRunBox" hidden style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px">
      <div class="row spread"><button class="chip" id="tBack" data-t="editText"></button><div class="row"><button class="chip" id="tHint" data-t="thisLetter"></button><button class="chip" id="tGo" data-t="practiceShort"></button><button class="chip" id="tAgain" data-t="listen"></button></div></div>
      <div class="tview" id="tView"></div>
      <div class="code empty" id="tCode" style="min-height:30px;display:flex;align-items:center"></div>
      <div id="textKeySlot" style="flex:1;min-height:0;display:flex"></div>
    </div>
  </section>

  <div id="park" hidden></div>
  <div id="keyer">
    <button class="key" id="bigKey"><span data-t="key"></span><small data-t="keyHint"></small></button>
    <div id="twoKeys" hidden><button class="key" id="dotKey" aria-label="dot">·</button><button class="key" id="dashKey" aria-label="dash">−</button></div>
  </div>

  <nav>
    <button data-tab="learn" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M8 3l4 4 4-4M12 9H5v6M12 9h7v4M5 15v5M19 13h-4v5"/><circle cx="5" cy="15" r="1.6"/><circle cx="19" cy="13" r="1.6"/></svg><span data-t="tLearn"></span></button>
    <button data-tab="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="15" width="18" height="5" rx="1.5"/><path d="M7 15l2-6h6l2 6M12 9V5"/><circle cx="12" cy="4" r="1.3"/></svg><span data-t="tKey"></span></button>
    <button data-tab="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h10M4 16h7"/><circle cx="17.5" cy="16" r="1.4" fill="currentColor"/><path d="M15 20h6"/></svg><span data-t="tText"></span></button>
    <button data-tab="radio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v10M9 21h6"/><circle cx="12" cy="9" r="2"/><path d="M8.2 5.2a5.4 5.4 0 0 0 0 7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 2.4a9.4 9.4 0 0 0 0 13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"/></svg><span data-t="tRadio"></span></button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span data-t="tQuiz"></span></button>
  </nav>
</div>

<div class="sheet-bg" id="sheet" hidden>

  </div>

<script>
// ---------- data ----------
// [code, letter, x, y, label side]
const TREE=[
 ['.','E',250,80,'n'],['..','I',310,80,'n'],['...','S',370,80,'n'],['....','H',430,80,'n'],
 ['-','T',150,80,'n'],['--','M',90,80,'n'],['---','O',30,80,'n'],
 ['--.','G',90,146,'e'],['--.-','Q',30,146,'w'],['--..','Z',90,210,'e'],
 ['-.','N',150,276,'ne'],['-.-','K',90,276,'n'],['-.--','Y',30,276,'n'],['-.-.','C',90,340,'e'],
 ['-..','D',150,403,'ne'],['-..-','X',90,403,'w'],['-...','B',150,470,'w'],
 ['.-','A',250,276,'sw'],['.-.','R',310,276,'s'],['.-..','L',370,276,'e'],
 ['.--','W',250,403,'sw'],['.--.','P',310,403,'s'],['.---','J',250,470,'e'],
 ['..-','U',310,146,'w'],['..-.','F',310,210,'w'],['...-','V',370,146,'e'],
 // Turkish letters
 ['---.','Ö',30,112,'w',null,1],['--.-.','Ğ',30,210,'w',null,1],['-.-..','Ç',90,372,'e',null,1],
 ['.--..','Ş',370,403,'e',null,1],['..--','Ü',345,210,'e',[345,146],1],
];
const ROOT={x:200,y:80};
const BY_CODE={},BY_LETTER={};
TREE.forEach(([c,l,x,y,s,via,tr])=>{const n={code:c,letter:l,x,y,side:s,via,tr:!!tr};BY_CODE[c]=n;BY_LETTER[l]=n});
BY_LETTER['İ']=BY_LETTER['I'];
const walkList=()=>('ETIANMSURWDKGOHVFLPJBXCYZQ'+(S.tr?'ÖÜÇĞŞ':'')+'1234567890').split('');
const active=c=>{const n=BY_CODE[c];return n&&(!n.tr||S.tr)};
const DIGITS={'1':'.----','2':'..---','3':'...--','4':'....-','5':'.....','6':'-....','7':'--...','8':'---..','9':'----.','0':'-----','?':'..--..','/':'-..-.','=':'-...-','.':'.-.-.-',',':'--..--'};
const DIGIT_BY_CODE=Object.fromEntries(Object.entries(DIGITS).map(([d,c])=>[c,d]));
const codeOf=ch=>DIGITS[ch]||(BY_LETTER[ch]&&BY_LETTER[ch].code);
const charOf=c=>active(c)?BY_CODE[c].letter:(DIGIT_BY_CODE[c]||null);
const validPrefix=c=>active(c)||Object.values(DIGITS).some(d=>d.startsWith(c));
const OFF={n:[0,-24],s:[0,30],e:[25,7],w:[-25,7],ne:[19,-15],sw:[-21,25]};
const glyph=c=>c.split('').map(s=>s==='.'?'·':'−').join('');
const symHTML=c=>'<span class="sym">'+c.split('').map(s=>'<i class="'+(s==='.'?'d':'h')+'"></i>').join('')+'</span>';
function setCode(el,c,extra=''){el.innerHTML=symHTML(c)+(extra?'<span style="margin-left:12px;font-size:18px;letter-spacing:0">'+extra+'</span>':'')}

// ---------- storage (native bridge in the app, localStorage in a browser) ----------
const Store={
  load(){try{if(window.__STORE)return window.__STORE;return JSON.parse(localStorage.getItem('morsetree')||'{}')}catch(e){return{}}},
  save(o){const s=JSON.stringify(o);try{window.webkit.messageHandlers.store.postMessage(s)}catch(e){}try{localStorage.setItem('morsetree',s)}catch(e){}}
};
const saved=Store.load();
const S=Object.assign({rmode:'morse',text:'CQ CQ DE TA2SYW K',call:'TA2SYW',lang:'en',tr:false,wpm:12,tone:650,gap:600,haptics:true,mouseKeys:null,twoKeys:false,qType:'send',level:2,hide:false,stats:{}},saved);
const persist=()=>Store.save(S);
const unit=()=>1200/S.wpm;
function haptic(k){if(!S.haptics)return;try{window.webkit.messageHandlers.haptic.postMessage(k)}catch(e){}}

// ---------- build tree ----------
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
const els={};
(function build(){
  const gE=$('edges'),gN=$('nodes'),gL=$('labels'),gH=$('hits');
  mk('path',{d:'M186 30 L200 50 L214 30 M200 26 V80',class:'antenna'},gN);
  mk('circle',{cx:200,cy:80,r:4,fill:'var(--brass)'},gN);
  TREE.forEach(([c])=>{
    const n=BY_CODE[c],p=c.length>1?BY_CODE[c.slice(0,-1)]:ROOT;
    const e=mk('path',{d:'M'+p.x+' '+p.y+(n.via?' L'+n.via[0]+' '+n.via[1]:'')+' L'+n.x+' '+n.y,class:'edge'+(n.tr?' tr':'')},gE);
    let shape;
    if(c.endsWith('.')) shape=mk('circle',{cx:n.x,cy:n.y,r:12.5,class:'node'},gN);
    else{const from=n.via||p;const horiz=from.y===n.y;const w=horiz?31:17,h=horiz?17:31;shape=mk('rect',{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:3,class:'node'},gN)}
    if(n.tr)shape.classList.add('tr');
    const o=OFF[n.side];
    const t=mk('text',{x:n.x+o[0],y:n.y+o[1],class:'lbl'+(n.tr?' tr':'')},gL);t.textContent=n.letter;
    const hit=mk('circle',{cx:n.x,cy:n.y,r:n.tr||['--.-','-.-.','---'].includes(c)?17:24,class:'hit'+(n.tr?' tr':'')},gH);
    hit.addEventListener('click',()=>onTreeTap(c));
    els[c]={edge:e,node:shape,lbl:t};
  });
})();

// numbers 0-9: two rows of chips under the tree; each shows its 5-symbol code
const NUMS='1234567890'.split('');
(function buildNums(){
  const g=mk('g',{},$('hits').parentNode);
  mk('text',{x:-12,y:503,class:'numhead'},g).textContent='0 – 9';
  mk('line',{x1:40,y1:503,x2:450,y2:503,class:'numrule'},g);
  NUMS.forEach((d,i)=>{
    const code=DIGITS[d],col=i%5,row=Math.floor(i/5),x=-18+col*95.6,y=518+row*40;
    const n={code,letter:d,x:x+44,y:y+15,digit:true};BY_CODE[code]=n;BY_LETTER[d]=n;
    const bg=mk('rect',{x,y,width:90,height:30,rx:7,class:'node dnode'},g);
    const lbl=mk('text',{x:x+14,y:y+16,class:'lbl dl'},g);lbl.textContent=d;
    // fit the 5 symbols inside the chip: dot 5 wide, dash 9 wide, 3 gap, centred right of the digit
    const gl=mk('g',{class:'dg'},g),syms=code.split(''),wid=syms.reduce((w,c)=>w+(c==='.'?5:9),0)+3*(syms.length-1);
    let gx=x+25+(60-wid)/2;
    syms.forEach(sym=>{if(sym==='.'){mk('circle',{cx:gx+2.5,cy:y+15,r:2.5},gl);gx+=5+3}else{mk('rect',{x:gx,y:y+12.75,width:9,height:4.5,rx:1.4},gl);gx+=9+3}});
    const hit=mk('rect',{x,y:y-4,width:90,height:38,class:'hit'},g);hit.addEventListener('click',()=>onTreeTap(code));
    els[code]={edge:gl,node:bg,lbl};
  });
})();
function clearLit(){for(const c in els){const x=els[c];x.edge.classList.remove('lit');x.node.classList.remove('lit','bad','sel');x.lbl.classList.remove('lit','reveal')}}
function lightPath(code,{reveal=false}={}){
  clearLit();
  for(let i=1;i<=code.length;i++){const x=els[code.slice(0,i)];if(!x)continue;x.edge.classList.add('lit');x.node.classList.add('lit');if(i===code.length){x.lbl.classList.add('lit');if(reveal)x.lbl.classList.add('reveal')}}
}
function lightStep(code){ // light only up to this prefix, keep earlier ones
  const x=els[code];if(!x)return;x.edge.classList.add('lit');x.node.classList.add('lit');
}
function applyHide(){
  const hide=(tab==='learn'&&S.hide)||(tab==='quiz'&&S.qType==='recv'&&!S.showLetters);
  $('card').classList.toggle('hide-labels',hide);
  $('lHide').classList.toggle('on',S.hide);
  $('qShowLetters').classList.toggle('on',!!S.showLetters);
}

// ---------- audio ----------
let ctx,osc,gain,rxOsc,rxGain;
function ensureAudio(){
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.gain.value=0;gain.connect(ctx.destination);
      osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=S.tone;osc.connect(gain);osc.start();
      rxGain=ctx.createGain();rxGain.gain.value=0;rxGain.connect(ctx.destination);rxOsc=ctx.createOscillator();rxOsc.type='sine';rxOsc.frequency.value=S.tone*0.82;rxOsc.connect(rxGain);rxOsc.start()}
    if(ctx.state!=='running')ctx.resume();
  }catch(e){}
}
const VOL=0.32;
function toneOn(){if(!ctx)return;const t=ctx.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setTargetAtTime(VOL,t,0.004)}
function toneOff(){if(!ctx)return;const t=ctx.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setTargetAtTime(0,t,0.004)}
let playTimers=[],playToken=0;
let playing=false,keyEnd=0; // keyEnd: audio time when the keyer is silent again (tone + required gap)
function stopPlayback(){playToken++;playTimers.forEach(clearTimeout);playTimers=[];if(playing){toneOff();playing=false}}
function rampOn(t){const g=gain.gain;g.cancelScheduledValues(t);g.setValueAtTime(0,t);g.linearRampToValueAtTime(VOL,t+0.005)}
function rampOff(t){const g=gain.gain;g.cancelScheduledValues(t);g.setValueAtTime(VOL,t);g.linearRampToValueAtTime(0,t+0.005)}
const minGap=()=>Math.max(0.035,unit()/2000); // always leave an audible gap between elements
// plays a code; animate lights each node as its tone starts
function playCode(code,{animate=true,onDone}={}){
  ensureAudio();stopPlayback();const tok=playToken;playing=true;
  const u=unit()/1000;
  const later=(ms,fn)=>playTimers.push(setTimeout(()=>{if(tok===playToken)fn()},ms));
  if(animate)clearLit();
  if(!ctx){ // no audio: still animate
    let t=0;code.split('').forEach((s,i)=>{later(t*1000,()=>animate&&lightStep(code.slice(0,i+1)));t+=(s==='.'?u:3*u)+u});
    if(onDone)later(t*1000,onDone);return;
  }
  const now=ctx.currentTime,start=now+0.06;let t=start;
  gain.gain.cancelScheduledValues(now);gain.gain.setValueAtTime(0,now);
  code.split('').forEach((s,i)=>{
    const d=s==='.'?u:3*u;
    gain.gain.setTargetAtTime(VOL,t,0.004);gain.gain.setTargetAtTime(0,t+d,0.004);
    const pre=code.slice(0,i+1);
    later((t-now)*1000,()=>{if(animate){lightStep(pre);if(i===code.length-1)els[pre]&&els[pre].lbl.classList.add('lit')}});
    t+=d+u;
  });
  later((t-now)*1000,()=>{playing=false;onDone&&onDone()});
}

// ---------- tabs ----------
let tab='learn';
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function setTab(t){
  if(RADIO.ptt)pttUp();
  tab=t;stopPlayback();stopWalk();resetKeyer();clearLit();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['learn','key','text','radio','quiz'].forEach(x=>$('p-'+x).hidden=x!==t);
  if(t==='radio'){$('radioKeySlot').appendChild($('keyer'));renderRadio();renderLog()}
  if(t==='text')setTextMode(X.mode==='practice'?'practice':'edit');
  if(t==='key')$('keySlot').appendChild($('keyer'));
  if(t==='quiz'){$('quizKeySlot').appendChild($('keyer'));setupQuiz()}
  if(t==='learn'){$('park').appendChild($('keyer'));showLearn(learnSel,false)}
  applyHide();
}

// ---------- learn ----------
let learnSel='.';
function showLearn(code,play=true){
  learnSel=code;const n=BY_CODE[code];
  $('lLetter').textContent=n.letter;setCode($('lCode'),code);
  const path=[];for(let i=1;i<=code.length;i++){const p=BY_CODE[code.slice(0,i)];if(p&&!p.digit&&(!p.tr||S.tr))path.push(p.letter)}if(n.digit)path.push(n.letter);
  $('lCrumbs').textContent=path.join(' → ');
  if(play)playCode(code,{onDone:()=>lightPath(code,{reveal:true})});else lightPath(code,{reveal:true});
}
$('lPlay').addEventListener('click',()=>{stopWalk();showLearn(learnSel)});
$('lHide').addEventListener('click',()=>{S.hide=!S.hide;persist();applyHide()});
let walking=false,walkTimer=null;
function stopWalk(){walking=false;clearTimeout(walkTimer);$('lWalk').textContent=t('walk');$('lWalk').classList.remove('on')}
$('lWalk').addEventListener('click',()=>{
  if(walking){stopWalk();stopPlayback();return}
  walking=true;$('lWalk').textContent=t('stop');$('lWalk').classList.add('on');let i=0;
  const step=()=>{if(!walking||tab!=='learn')return;const W=walkList();if(i>=W.length){stopWalk();return}
    const c=BY_LETTER[W[i++]].code;learnSel=c;
    const n=BY_CODE[c];$('lLetter').textContent=n.letter;setCode($('lCode'),c);
    const path=[];for(let k=1;k<=c.length;k++){const p=BY_CODE[c.slice(0,k)];if(p&&!p.digit&&(!p.tr||S.tr))path.push(p.letter)}if(n.digit)path.push(n.letter);$('lCrumbs').textContent=path.join(' → ');
    playCode(c,{onDone:()=>{lightPath(c,{reveal:true});walkTimer=setTimeout(step,650)}})};
  step();
});

function onTreeTap(code){
  ensureAudio();haptic('light');
  if(tab==='learn'){stopWalk();showLearn(code)}
  else if(tab==='key'){playCode(code,{onDone:()=>lightPath(code)})}
  else if(tab==='quiz'&&S.qType==='recv')answerRecv(code);
}

// ---------- keyer ----------
const K={code:'',down:null,timer:null,wordTimer:null};
function resetKeyer(){clearTimeout(K.timer);clearTimeout(K.wordTimer);K.code='';K.down=null;toneOff();$('kCur').textContent='';['bigKey','dotKey','dashKey'].forEach(i=>$(i).classList.remove('down'))}
function threshold(){return Math.max(unit()*2,160)}
function keyDown(el){ensureAudio();stopPlayback();clearTimeout(K.timer);clearTimeout(K.wordTimer);K.down=performance.now();el.classList.add('down');haptic('light');
  if(ctx){K.onAt=Math.max(ctx.currentTime,keyEnd);rampOn(K.onAt)}
  if(txLive())radioSend({e:'d',t:ctx?perfOf(K.onAt):performance.now()})}
function keyUp(el){if(K.down==null)return;const d=performance.now()-K.down;K.down=null;el.classList.remove('down');
  const sym=d<threshold()?'.':'-';
  if(ctx){const off=Math.max(ctx.currentTime,K.onAt+0.02);rampOff(off);keyEnd=off+0.005+minGap();if(txLive())radioSend({e:'u',t:perfOf(off),s:sym})}
  else if(txLive())radioSend({e:'u',t:performance.now(),s:sym});
  addSymbol(sym)}
function addSymbol(s){
  K.code+=s;
  if(!active(K.code)){let c=K.code;while(c&&!active(c))c=c.slice(0,-1);lightPath(c)}
  else lightPath(K.code);
  updateCur();clearTimeout(K.timer);K.timer=setTimeout(commitLetter,(tab==='radio'?3*unit():S.gap)+(K.extra||0)); // radio: standard 3-unit letter gapK.extra=0;
}
function updateCur(){
  const ok=validPrefix(K.code);
  if(tab==='key'){setCode($('kCur'),K.code);$('kCur').style.color=ok||!K.code?'':'var(--bad)'}
  if(tab==='radio'){setCode($('rCur'),K.code);$('rCur').style.color=ok||!K.code?'':'var(--bad)'}
  if(tab==='text'&&X.mode==='practice'){const q=$('tCode');if(K.code){setCode(q,K.code);q.className='code'+(ok?'':' bad')}else textPrompt()}
  if(tab==='quiz'&&S.qType!=='recv'){const q=$('qCode');q.className='code'+(K.code&&!ok?' bad':'');if(K.code)setCode(q,K.code);else{q.textContent=t('keyLetter');q.className='code empty'}}
}
function commitLetter(){
  const code=K.code;K.code='';if(!code)return;
  const ch=charOf(code);
  if(tab==='key'){
    const span=$('kOut').firstChild;span.textContent+=ch||'?';$('kCur').textContent='';
    if(active(code))lightPath(code,{reveal:true});
    K.wordTimer=setTimeout(()=>{if(span.textContent&&!span.textContent.endsWith(' '))span.textContent+=' '},Math.max(S.gap*2.2,1400));
  }else if(tab==='quiz')answerSend(code);
  else if(tab==='text'&&X.mode==='practice')answerText(code);
  else if(tab==='radio'){
    logAdd('tx',ch||'?');if(active(code))lightPath(code,{reveal:true});$('rCur').textContent='';
    if(txLive())radioSend({e:'c',t:performance.now(),ch:ch||'?'});
    K.wordTimer=setTimeout(()=>{logAdd('tx',' ');if(txLive())radioSend({e:'s',t:performance.now()})},4*unit()); // 3+4 = standard 7-unit word gap
  }
}
// one key
const big=$('bigKey');
big.addEventListener('pointerdown',e=>{e.preventDefault();try{big.setPointerCapture(e.pointerId)}catch(_){}keyDown(big)});
['pointerup','pointercancel'].forEach(ev=>big.addEventListener(ev,()=>keyUp(big)));
big.addEventListener('contextmenu',e=>e.preventDefault());
// two keys
function tapSym(el,s){
  ensureAudio();stopPlayback();clearTimeout(K.timer);clearTimeout(K.wordTimer);haptic('light');
  el.classList.add('down');setTimeout(()=>el.classList.remove('down'),120);
  if(ctx){const u=unit()/1000,now=ctx.currentTime,start=Math.max(now,keyEnd),d=s==='.'?u:3*u;rampOn(start);rampOff(start+d);keyEnd=start+d+0.005+Math.max(u,minGap());K.extra=(keyEnd-now)*1000;
    if(txLive()){radioSend({e:'d',t:perfOf(start)});radioSend({e:'u',t:perfOf(start+d),s})}}
  addSymbol(s);
}
$('dotKey').addEventListener('pointerdown',e=>{e.preventDefault();tapSym($('dotKey'),'.')});
$('dashKey').addEventListener('pointerdown',e=>{e.preventDefault();tapSym($('dashKey'),'-')});
// mouse keying (Settings): left click = dot, right click = dash, on the keyer area.
// In the Mac app clicks arrive as touches and right clicks never reach the page,
// so the native shell calls window.__mouseKey('-',x,y) for a right click.
const keyerEl=$('keyer');
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
let lastRight=0;
function inKeyer(x,y){const r=keyerEl.getBoundingClientRect();return r.width>0&&x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&!$('park').contains(keyerEl)&&$('sheet').hidden}
function mouseSym(s){tapSym(S.twoKeys?$(s==='.'?'dotKey':'dashKey'):big,s)}
window.__mouseKey=(s,x,y)=>{if(!S.mouseKeys)return false;if(s==='-'&&performance.now()-lastRight<400)return true;if(x!=null&&!inKeyer(x,y))return false;mouseSym(s);return true};
keyerEl.addEventListener('pointerdown',e=>{
  if(!S.mouseKeys||(e.button!==0&&e.button!==2))return;
  e.preventDefault();e.stopPropagation();
  if(e.button===2)lastRight=performance.now();
  mouseSym(e.button===0?'.':'-');
},true);
keyerEl.addEventListener('contextmenu',e=>e.preventDefault());
keyerEl.addEventListener('mousedown',e=>{if(e.button===2)e.preventDefault()});
function applyMouseHint(){big.querySelector('small').dataset.t=S.mouseKeys?'keyHintMouse':'keyHint';big.querySelector('small').textContent=t(big.querySelector('small').dataset.t)}
function applyKeyMode(){
  big.hidden=S.twoKeys;$('twoKeys').hidden=!S.twoKeys;

// ---------- Radio: connectionless Bluetooth broadcast ----------
// Every phone advertises a tiny BLE packet; every phone in range picks it up. Nobody connects, so listeners are unlimited.
// Packet payload (14 bytes): [sender id][first event index hi][lo][count][up to 10 event bytes]
//   ON  1s dddddd  key down for d×20 ms, s=1 dash
//   OFF 01 dddddd  silence for d×40 ms
//   CHR 00 cccccc  letter decoded by the sender (index into ALPHA); 62 = sender went idle
// Each packet repeats the last 10 events, so a missed packet is covered by the next one.
const ALPHA=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ÇĞÖŞÜ?/=.,',IDLE=62,BUF=0.5;
const RADIO={talkers:new Set(),ptt:false,pps:null,notice:null,on:false,bt:'',hide:false,log:[],heard:{},st:{},lastTag:null};
const TX={id:Math.floor(Math.random()*256),idx:0,evs:[IDLE],lastDown:null,lastUp:null,flushT:null,idleT:null};
const hasNative=()=>!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.radio);
function radioCmd(o){try{window.webkit.messageHandlers.radio.postMessage(o)}catch(e){}}
const txLive=()=>tab==='radio'&&RADIO.on&&S.rmode==='morse';
const perfOf=at=>performance.now()+(at-ctx.currentTime)*1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function txPush(b){
  TX.evs.push(b);TX.idx=(TX.idx+1)&0xffff;if(TX.evs.length>10)TX.evs.shift();
  if(!TX.flushT)TX.flushT=setTimeout(()=>{TX.flushT=null;txFlush()},20);
  clearTimeout(TX.idleT);if(b!==IDLE)TX.idleT=setTimeout(()=>{TX.lastUp=null;txPush(IDLE)},3000);
}
function txFlush(){
  const first=(TX.idx-TX.evs.length+1)&0xffff,b=[TX.id,first>>8,first&255,TX.evs.length,...TX.evs];
  while(b.length<14)b.push(0);
  radioCmd({cmd:'adv',hex:b.map(x=>x.toString(16).padStart(2,'0')).join('')});
}
// keyer hooks call this with sender-clock times; turn them into compact durations
function radioSend(o){
  if(!RADIO.on||S.rmode!=='morse')return;
  if(o.e==='d'){txPush(0x40|(TX.lastUp==null?63:clamp(Math.round((o.t-TX.lastUp)/40),0,63)));TX.lastDown=o.t}
  else if(o.e==='u'){txPush(0x80|(o.s==='-'?0x40:0)|clamp(Math.round((o.t-TX.lastDown)/20),1,63));TX.lastUp=o.t}
  else if(o.e==='c'){const i=ALPHA.indexOf(o.ch);txPush(i<0?61:i)}
  else if(o.e==='s')txPush(0);
}
function renderRadio(){

function station(id,name){

// Replays a station with fixed spacing so it is easy to copy:
//   inside a letter exactly 1 unit, between letters at least 3 units, between words at least 7 units.
// The unit comes from the sender's own dot length, so each station keeps its speed.
// Letter and word boundaries are the ones the sender's keyer decided, so letters never run together.
function rxPlay(st,evs){
  if(!ctx)return;
  const now=ctx.currentTime;
  evs.forEach(b=>{
    if(b&0x80){
      const d=(b&63)*0.02,dash=!!(b&0x40),est=dash?d/3:d;
      st.unit=st.unit?st.unit*0.7+est*0.3:est;st.unit=clamp(st.unit,0.04,0.25);
      const u=st.unit;let start;
      if(st.lastEnd==null||st.brk==='idle')start=now+BUF;
      else if(st.brk==='sym')start=st.lastEnd+u;
      else start=st.lastEnd+Math.max(st.brk==='word'?7*u:3*u,st.pendOff||0);
      if(start<now+0.02)start=now+BUF; // fell behind the sender: rebuild the buffer
      const g=st.g.gain,sym=dash?'-':'.';
      g.cancelScheduledValues(start);g.setValueAtTime(0,start);g.linearRampToValueAtTime(VOL,start+0.005);g.setValueAtTime(VOL,start+d);g.linearRampToValueAtTime(0,start+d+0.005);
      later2(start+d,()=>{st.code+=sym;if(tab==='radio'){setCode($('rRxCur'),st.code);if(!K.code)lightPath(st.code)}});
      st.lastEnd=start+d;st.brk='sym';st.pendOff=0;
    }
    else if(b&0x40)st.pendOff=Math.min((b&63)*0.04,1.5);
    else if(b===IDLE)st.brk='idle';
    else{
      const ch=b<ALPHA.length?ALPHA[b]:'?';
      if(st.brk!=='idle')st.brk=ch===' '?'word':(st.brk==='word'?'word':'letter');
      const a=st.lastEnd!=null?Math.max(st.lastEnd+0.01,now):now;
      later2(a,()=>{if(ch!==' '){st.code='';if(tab==='radio')$('rRxCur').textContent=''}
        logAdd('rx',ch,st.name);if(ch!==' '&&tab==='radio'&&!K.code&&!RADIO.hide){const c=codeOf(ch);if(c&&active(c))lightPath(c,{reveal:true})}});
    }
  });
}
function rxPacket(hex,name){
  const b=[];for(let i=0;i+1<hex.length;i+=2)b.push(parseInt(hex.substr(i,2),16));
  if(b.length<4)return;
  const id=b[0],first=(b[1]<<8)|b[2],n=Math.min(b[3],10),evs=b.slice(4,4+n),st=station(id,name);
  RADIO.heard[st.name]=Date.now();
  let fresh;
  if(st.last==null){ // first time we hear this station: skip anything from before it last went idle
    const k=evs.lastIndexOf(IDLE);fresh=evs.slice(k+1);
  }else fresh=evs.filter((e,i)=>{const d=(first+i-st.last)&0xffff;return d>0&&d<0x8000});
  st.last=(first+n-1)&0xffff;
  if(fresh.length)rxPlay(st,fresh);
}

function playText(str,{onChar,onDone,onSym,onLetter,onSpace}={}){
  ensureAudio();stopPlayback();const tok=playToken;playing=true;
  const u=unit()/1000,later=(ms,fn)=>playTimers.push(setTimeout(()=>{if(tok===playToken)fn()},Math.max(0,ms)));
  const now=ctx?ctx.currentTime:0;let tt=now+0.08;
  if(ctx){gain.gain.cancelScheduledValues(now);gain.gain.setValueAtTime(0,now)}
  [...str].forEach((ch,i)=>{
    if(ch===' '){tt+=4*u;onSpace&&onSpace(tt);return}

  sec(t('gRst'),'',RST.filter(x=>f(x[0],x[1],x[2])).map(x=>gRow(x[0],x[1+L],/^\d+$/.test(x[0])?glyphText(x[0]):'',/^\d+$/.test(x[0])?'T:'+x[0]:'',false)));
  const q=qsoLines().filter(x=>f(x[0],x[1]));
  if(q.length)h+='<div class="g-sec"><h3>'+t('gQso')+'</h3>'+(qq?'':'<p>'+t('gQsop')+'</p>')+q.map(x=>'<div class="g-qso">'+esc(x[0])+'<small>'+esc(x[1])+'</small></div>').join('')+'</div>';
  $('gList').innerHTML=h||'<div class="g-empty">'+t('gNone')+'</div>';
}
$('gList').addEventListener('click',e=>{const b=e.target.closest('.g-row');if(!b||!b.dataset.play)return;const p=b.dataset.play,v=p.slice(2);
  if(p[0]==='C')playCode(v,{animate:false});else playText(v)});
$('gSearch').addEventListener('input',renderGloss);
function openSheet(which){if(which===true)which='help';if(which===false)which='set';
  $('sheetTitle').textContent=t(which==='help'?'helpTitle':which==='gloss'?'gloss':'settings');
  $('setBody').hidden=which!=='set';$('helpBody').hidden=which!=='help';$('glossBody').hidden=which!=='gloss';
  if(which==='gloss'){$('gSearch').placeholder=t('gSearch');renderGloss();$('glossBody').scrollTop=0}
  $('sheet').hidden=false}
$('glossBtn').addEventListener('click',()=>openSheet('gloss'));
$('setBtn').addEventListener('click',()=>openSheet(false));
$('helpBtn').addEventListener('click',()=>openSheet(true));
$('sheetClose').addEventListener('click',()=>$('sheet').hidden=true);
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').hidden=true});
function syncSettings(){
  if(document.activeElement!==$('call'))$('call').value=S.call||'';
  $('wpm').value=S.wpm;$('wpmV').textContent=S.wpm+' wpm';
  $('tone').value=S.tone;$('toneV').textContent=S.tone+' Hz';
  $('gap').value=S.gap;$('gapV').textContent=(S.gap/1000).toFixed(2).replace(/0$/,'')+' s';
  $('card').classList.toggle('no-tr',!S.tr);
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lang));
  $('hapt').classList.toggle('on',S.haptics);$('hapt').textContent=t(S.haptics?'hapOn':'hapOff');$('mouseK').classList.toggle('on',!!S.mouseKeys);$('mouseK').textContent=t(S.mouseKeys?'mouseOn':'mouseOff');applyMouseHint();
  if(osc)osc.frequency.value=S.tone;if(rxOsc)rxOsc.frequency.value=S.tone*0.82;
}
$('call').addEventListener('input',e=>{S.call=e.target.value.toUpperCase();persist()});
$('wpm').addEventListener('input',e=>{S.wpm=+e.target.value;syncSettings();persist()});
$('tone').addEventListener('input',e=>{S.tone=+e.target.value;syncSettings();persist()});
$('tone').addEventListener('change',()=>{ensureAudio();playCode('.',{animate:false})});
$('gap').addEventListener('input',e=>{S.gap=+e.target.value;syncSettings();persist()});
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.v;S.tr=S.lang==='tr';applyLang();syncSettings();persist();if(tab==='quiz')setupQuiz();if(tab==='learn')stopWalk()}));
$('mouseK').addEventListener('click',()=>{S.mouseKeys=!S.mouseKeys;syncSettings();persist()});
$('hapt').addEventListener('click',()=>{S.haptics=!S.haptics;syncSettings();persist();haptic('light')});
let resetArmed=false;
$('resetStats').addEventListener('click',()=>{
  if(!resetArmed){resetArmed=true;$('resetStats').textContent=t('resetAgain');setTimeout(()=>{resetArmed=false;$('resetStats').textContent=t('reset')},2500);return}
  S.stats={};Q.streak=0;persist();renderHeat();resetArmed=false;$('resetStats').textContent=t('cleared')});

// unlock audio on the first touch anywhere (iOS needs a gesture)
document.addEventListener('pointerdown',ensureAudio,{once:true,capture:true});

if(S.mouseKeys==null)S.mouseKeys=FINE||!!window.__CATALYST;
applyLang();syncSettings();applyKeyMode();setTab('learn');
// App Store screenshot scenes (only when the app is launched with -shot <scene>)
if(window.__SHOT){const sc=window.__SHOT;S.lang='en';S.tr=false;S.hide=false;applyLang();
  setTimeout(()=>{
    if(sc==='learn'){setTab('learn');showLearn('.-.',false);lightPath('.-.',{reveal:true})}
    if(sc==='key'){setTab('key');$('kOut').firstChild.textContent='CQ CQ DE TA2SYW ';lightPath('-.-',{reveal:true});setCode($('kCur'),'-.-')}
    if(sc==='quiz'){S.qType='send';S.level=3;setTab('quiz')}
    if(sc==='gloss'){setTab('learn');openSheet('gloss')}
    if(sc==='text'){S.text='CQ CQ DE TA2SYW K';setTab('text')}
    if(sc==='radio'){setTab('radio')}
  },300)}
</script>
</body>
</html>
